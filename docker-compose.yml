version: '3.9'
services:

  app:
    build: .
    ports:
      - '8080:8080'
    env_file: .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: repomind
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
 
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
 
volumes:
  pgdata:
